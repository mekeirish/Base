<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multi-PWA Skeuomorphic Dashboard</title>
    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #151515;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Console supérieure Squeuomorphique */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 12px;
            background: linear-gradient(180deg, #222222 0%, #181818 100%);
            border-bottom: 2px solid #101010;
            box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.1), 0 6px 15px rgba(0, 0, 0, 0.6);
            z-index: 10;
            gap: 10px;
        }

        /* Emplacement / Logement du bouton (effet encastré) */
        .btn-socket {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111111;
            padding: 6px 4px 8px 4px;
            border-radius: 12px;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.05);
            gap: 6px;
        }

        /* LED Squeuomorphique */
        .led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #333333;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        /* Bouton physique poussoir */
        .pwa-btn {
            width: 100%;
            border: none;
            padding: 10px 2px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0a0a0;
            cursor: pointer;
            position: relative;
            
            /* Rendu plastique 3D lourd */
            background: linear-gradient(180deg, #3a3a3a 0%, #262626 100%);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 4px 0 #181818,
                0 5px 6px rgba(0, 0, 0, 0.5);
                
            transition: none;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Effet mécanique d'enfoncement (Actif / Clic) */
        .pwa-btn.active {
            color: #ffffff;
            background: linear-gradient(180deg, #222222 0%, #2d2d2d 100%);
            transform: translateY(4px);
            box-shadow: 
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0px 0 #181818,
                0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* États allumés des LED indexés par couleur de PWA */
        .btn-socket.active-master .led { background-color: #ff3b30; box-shadow: 0 0 10px #ff3b30, inset 0 1px 1px rgba(255,255,255,0.5); }
        .btn-socket.active-brain .led  { background-color: #007aff; box-shadow: 0 0 10px #007aff, inset 0 1px 1px rgba(255,255,255,0.5); }
        .btn-socket.active-sniper .led { background-color: #ff2d55; box-shadow: 0 0 10px #ff2d55, inset 0 1px 1px rgba(255,255,255,0.5); }
        .btn-socket.active-lab .led    { background-color: #4cd964; box-shadow: 0 0 10px #4cd964, inset 0 1px 1px rgba(255,255,255,0.5); }
        .btn-socket.active-hub .led    { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00, inset 0 1px 1px rgba(255,255,255,0.5); }

        /* Différenciation subtile des écritures au survol/activation */
        .btn-socket.active-master .pwa-btn.active { text-shadow: 0 0 4px rgba(255, 59, 48, 0.4); }
        .btn-socket.active-brain .pwa-btn.active  { text-shadow: 0 0 4px rgba(0, 122, 255, 0.4); }
        .btn-socket.active-sniper .pwa-btn.active { text-shadow: 0 0 4px rgba(255, 45, 85, 0.4); }
        .btn-socket.active-lab .pwa-btn.active    { text-shadow: 0 0 4px rgba(76, 217, 100, 0.4); }
        .btn-socket.active-hub .pwa-btn.active    { text-shadow: 0 0 4px rgba(255, 204, 0, 0.4); }

        /* Espace de travail de simulation */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-color: #111111;
            overflow: hidden;
        }

        /* Châssis lourd du Smartphone */
        .phone-container {
            width: 100%;
            height: 100%;
            max-width: 412px;
            max-height: 860px;
            background-color: #000000;
            border-radius: 36px;
            border: 8px solid #282828;
            box-shadow: 
                inset 0 0 4px rgba(0,0,0,0.8),
                0 25px 60px rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Zone d'affichage interne */
        .content-area {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1a1a1a;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* Pied de page et Signature technique */
        footer {
            background-color: #181818;
            padding: 10px;
            text-align: center;
            font-size: 10px;
            color: #444444;
            font-weight: 600;
            letter-spacing: 1px;
            border-top: 2px solid #101010;
            text-transform: uppercase;
            z-index: 10;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        /* Mode plein écran sur vrai Smartphone */
        @media (max-width: 480px) {
            .workspace {
                padding: 0;
                background-color: #151515;
            }
            .phone-container {
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body>

    <!-- Console de commande Squeuomorphique -->
    <nav class="nav-bar">
        <div id="socket-master" class="btn-socket active-master">
            <div class="led"></div>
            <button class="pwa-btn active" onclick="switchTab('master', this, 'master')">Master</button>
        </div>
        <div id="socket-brain" class="btn-socket">
            <div class="led"></div>
            <button class="pwa-btn" onclick="switchTab('brain', this, 'brain')">Brain</button>
        </div>
        <div id="socket-sniper" class="btn-socket">
            <div class="led"></div>
            <button class="pwa-btn" onclick="switchTab('sniper', this, 'sniper')">Sniper</button>
        </div>
        <div id="socket-lab" class="btn-socket">
            <div class="led"></div>
            <button class="pwa-btn" onclick="switchTab('lab', this, 'lab')">Lab</button>
        </div>
        <div id="socket-hub" class="btn-socket">
            <div class="led"></div>
            <button class="pwa-btn" onclick="switchTab('hub', this, 'hub')">Hub</button>
        </div>
    </nav>

    <!-- Zone Rendu Smartphone -->
    <main class="workspace">
        <div class="phone-container">
            <div class="content-area">
                <iframe id="iframe-master" class="active" src="https://mekeirish.github.io/Mastercode/" allow="geolocation; microphone; camera; clipboard-write; clipboard-read"></iframe>
                <iframe id="iframe-brain" src="https://mekeirish.github.io/Braincode/" allow="geolocation; microphone; camera; clipboard-write; clipboard-read"></iframe>
                <iframe id="iframe-sniper" src="https://mekeirish.github.io/Snipercode/" allow="geolocation; microphone; camera; clipboard-write; clipboard-read"></iframe>
                <iframe id="iframe-lab" src="https://mekeirish.github.io/Labcode/" allow="geolocation; microphone; camera; clipboard-write; clipboard-read"></iframe>
                <iframe id="iframe-hub" src="https://mekeirish.github.io/Hubcode/" allow="geolocation; microphone; camera; clipboard-write; clipboard-read"></iframe>
            </div>
        </div>
    </main>

    <!-- Signature Discrète -->
    <footer>
        Made by Laiche Brahim 2026 Paris
    </footer>

    <script>
        function switchTab(targetId, button, colorName) {
            // Évite d'agir si l'onglet est déjà actif
            if (button.classList.contains('active')) return;

            // 1. Retour Haptique (Vibration smartphone)
            // Modèle de vibration mécanique court et sec (45ms)
            if (navigator.vibrate) {
                navigator.vibrate(45);
            }

            // 2. Gestion squeuomorphique des boutons et sockets (LEDs)
            document.querySelectorAll('.pwa-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.btn-socket').forEach(socket => {
                // Enlève toutes les classes d'activation possibles des sockets
                socket.className = 'btn-socket';
            });

            // Activer l'élément ciblé
            button.classList.add('active');
            const parentSocket = document.getElementById(`socket-${targetId}`);
            parentSocket.classList.add(`active-${colorName}`);

            // 3. Permutation des Iframes (sans rechargement)
            document.querySelectorAll('.content-area iframe').forEach(iframe => {
                iframe.classList.remove('active');
            });
            
            const targetIframe = document.getElementById(`iframe-${targetId}`);
            targetIframe.classList.add('active');
        }
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
